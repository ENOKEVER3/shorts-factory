name: Shorts Factory

on:
  schedule:
    # Times are UTC. Two posting windows (see config.json "slots_utc").
    # Each window gets two runs: the second one is an automatic retry and
    # exits in seconds if the first one already published.
    - cron: "7 13 * * *"   # afternoon slot
    - cron: "7 16 * * *"   # afternoon retry
    - cron: "7 19 * * *"   # evening slot
    - cron: "7 22 * * *"   # evening retry
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only - do NOT upload (download the video from Artifacts)"
        type: boolean
        default: true
      force:
        description: "Post now, ignoring the posting windows"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shorts-factory
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (with retries)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
            echo "apt failed, retrying in 20s"; sleep 20
          done
          ffmpeg -version | head -1

      - name: Install Python packages (with retries)
        run: |
          for i in 1 2 3; do pip install -q -r requirements.txt && break; sleep 15; done

      - name: Self-test
        run: python -m unittest discover tests

      - name: Produce and publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main

      - name: Save progress to the repo
        if: always() && env.DRY_RUN != '1'
        run: |
          mkdir -p state content/generated
          git config user.name "shorts-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state content/generated
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update posting log [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            echo "Push failed, retrying in $((i*10))s"; sleep $((i*10))
          done
          exit 1

      - name: Keep the rendered video for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
