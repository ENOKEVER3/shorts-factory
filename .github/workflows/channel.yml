name: Channel Optimization
on:
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [sync, apply, optimize]
        default: sync
      edits:
        type: string
        default: '[]'
permissions:
  contents: read
  actions: read
concurrency:
  group: channel-metadata
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - name: Restore private subscriber history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=subscriber-history&per_page=5" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -n "$artifact" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > /tmp/history.zip
            unzip -o /tmp/history.zip -d out
          fi
          snapshot=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=channel-snapshot&per_page=5" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -n "$snapshot" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$snapshot/zip" > /tmp/previous-channel.zip
            unzip -p /tmp/previous-channel.zip channel.json > out/previous-channel.json
          fi
      - name: Sync or update owned videos
        env:
          CHANNEL_MODE: ${{ inputs.mode || 'sync' }}
          VIDEO_EDITS: ${{ inputs.edits || '[]' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.channel
      - name: Save private channel snapshot and backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-snapshot
          path: out/channel*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Carry forward private subscriber history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscriber-history
          path: out/subscribers.json
          retention-days: 90
          if-no-files-found: warn
