name: Shorts Prepare (ready queue)

on:
  schedule:
    # Render the next Shorts hours before the posting windows so a posting slot only uploads.
    - cron: "17 6 * * *"
    - cron: "17 10 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read

concurrency:
  group: shorts-factory
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MODE: prepare
      DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (fast static build, apt as backup)
        run: |
          for i in 1 2 3; do
            curl -fsSL --max-time 180 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 \
              && sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/ && break
            echo "static download failed, retrying in 10s"; sleep 10
          done
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2; do
              timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg && break
              sleep 20
            done
          fi
          ffmpeg -version | head -1
          command -v ffprobe

      - name: Install Python packages (with retries)
        run: |
          for i in 1 2 3; do pip install -q -r requirements.txt && break; sleep 15; done

      - name: Cache voice + caption models (Kokoro, Whisper, Piper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/huggingface
            ~/.cache/piper
          key: voice-models-v1

      - name: Self-test
        run: python -m unittest discover tests

      - name: Prepare the next Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          VEO_API_KEY: ${{ secrets.VEO_API_KEY }}
        run: python -m src.main

      - name: Name the queue artifact
        id: q
        if: success()
        run: |
          f=$(ls out/queue/*.mp4 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then echo "name=queued-$(basename "$f" .mp4)" >> "$GITHUB_OUTPUT"; else echo "name=none" >> "$GITHUB_OUTPUT"; fi

      - name: Save progress to the repo
        if: success()
        run: |
          mkdir -p state content/generated
          git config user.name "shorts-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state content/generated
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update ready queue [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            echo "Push failed, retrying in $((i*10))s"; sleep $((i*10))
          done
          exit 1

      - name: Store the prepared Short in the queue
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.q.outputs.name }}
          path: out/queue/*.mp4
          retention-days: 14
          if-no-files-found: ignore
